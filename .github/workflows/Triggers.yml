name: Triggers

on:
  push:
    branches: [ "main", "realease/**" ] # Cualquier rama que empieze con realease 
    paths:
      - "src/**" # Solo si cambia algo dentro de src
      - "tests/**" # Solo si cambia algo dentro de tests

  pull_request:
    branches: 
      - main
      - realease/**
    paths:
      - "src/**" # Solo si cambia algo dentro de src
      - "tests/**" # Solo si cambia algo dentro de tests

permissions: 
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Confirmar que el trigger pasó los filtros
        run: |
          echo "Branch: ${{github.ref_name}}"
          echo "Evento: ${{github.event_name}}"
          echo "Commit: ${{github.sha}}"
