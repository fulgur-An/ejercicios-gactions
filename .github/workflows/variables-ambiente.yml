name: Variables Ambiente ENV

on:
  push:

  # Permite ejecutar el workflow de forma manual
  workflow_dispatch:
env:
  SALUDO: "Hola desde el workflow"
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "demo-env"
  demo-env:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env:
      SALUDO: "Hola desde el job"


    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: "Mostrar variable a nivel de JOB"
        run: echo "SALUDO = $SALUDO"
  
      - name: Mostrar variable a nivel del step
        env:
          SALUDO: "hola desde el STEP"
        run: echo "SALUDO = $SALUDO"

  demo2-env:
    runs-on: ubuntu-latest

    steps:
      - name: "Mostra variable del workflow"
        run: echo "SALUDO = $SALUDO"
